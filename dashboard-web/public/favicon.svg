<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background Glow -->
  <circle cx="50" cy="50" r="45" fill="url(#glowGrad)" />
  
  <!-- Outer Focus brackets -->
  <path d="M 20 30 L 20 20 L 30 20" stroke="url(#purpleGrad)" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <path d="M 80 30 L 80 20 L 70 20" stroke="url(#purpleGrad)" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <path d="M 20 70 L 20 80 L 30 80" stroke="url(#purpleGrad)" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <path d="M 80 70 L 80 80 L 70 80" stroke="url(#purpleGrad)" stroke-width="3.5" fill="none" stroke-linecap="round" />

  <!-- CCTV Camera Body Shape -->
  <rect x="30" y="32" width="40" height="26" rx="5" fill="#111827" stroke="url(#purpleGrad)" stroke-width="3" />
  <!-- Lens Housing -->
  <path d="M 40 58 L 34 68 L 66 68 Z" fill="url(#purpleGrad)" />
  <circle cx="50" cy="68" r="3" fill="#ffffff" />
  
  <!-- CCTV Camera Mount arm -->
  <path d="M 50 32 L 50 16 L 40 16" stroke="url(#purpleGrad)" stroke-width="3" fill="none" stroke-linecap="round" />
  
  <!-- Camera Lens ring -->
  <circle cx="50" cy="45" r="9" fill="#030712" stroke="url(#purpleGrad)" stroke-width="2.5" />
  <!-- Inner Glass reflection -->
  <circle cx="48" cy="43" r="3" fill="#38bdf8" opacity="0.6" />
  <circle cx="51" cy="46" r="1.5" fill="#ffffff" />
  
  <!-- Blinking Rec indicator -->
  <circle cx="62" cy="38" r="1.5" fill="#ef4444" />
</svg>